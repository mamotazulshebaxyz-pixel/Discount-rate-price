<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Price & Discount Converter</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            padding: 30px;
            margin: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin: 0;
        }
        .discount-input-wrapper {
            display: flex;
            align-items: center;
            background: #fff0f5;
            border: 2px solid #e91e63;
            border-radius: 6px;
            padding: 2px 8px;
        }
        .discount-input-wrapper input {
            width: 45px;
            border: none;
            background: transparent;
            font-size: 18px;
            font-weight: bold;
            color: #e91e63;
            text-align: right;
            outline: none;
        }
        .discount-input-wrapper span {
            font-size: 18px;
            font-weight: bold;
            color: #e91e63;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        .search-box input:focus {
            border-color: #e91e63;
        }
        .search-btn {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-btn:hover {
            background-color: #d81b60;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        @media (max-width: 650px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
        .box {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
        textarea {
            width: 100%;
            height: 220px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #e91e63;
        }
        #output {
            background-color: #f9f9f9;
            color: #222;
            font-weight: 500;
        }
        .btn-container {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .copy-btn {
            background-color: #e91e63;
            color: white;
        }
        .copy-btn:hover {
            background-color: #d81b60;
        }
        .clear-btn {
            background-color: #757575;
            color: white;
        }
        .clear-btn:hover {
            background-color: #616161;
        }
        .copy-msg {
            color: #2e7d32;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }
        .status-msg {
            color: #e91e63;
            font-size: 13px;
            margin-bottom: 10px;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h2>Service Price & Discount Converter</h2>
        <div class="discount-input-wrapper">
            <input type="number" id="discountPercent" value="10" min="0" max="100" oninput="processData()">
            <span>%</span>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="সার্ভিসের নাম লিখুন (যেমন: AC Check Up)...">
        <button class="search-btn" onclick="fetchShebaService()">Live Search</button>
    </div>
    <div id="status" class="status-msg"></div>

    <div class="grid-container">
        <div class="box">
            <label for="input">Input:</label>
            <textarea id="input" placeholder="এখানে পেস্ট করো বা উপরে সার্চ করো..." oninput="processData()"></textarea>
            <div class="btn-container">
                <button class="clear-btn" onclick="clearAll()">Clear</button>
            </div>
        </div>

        <div class="box">
            <label for="output">স্বয়ংক্রিয় আউটপুট (Result):</label>
            <textarea id="output" readonly placeholder="ফলাফল এখানে দেখাবে..."></textarea>
            <div class="btn-container">
                <button class="copy-btn" onclick="copyOutput()">Copy Result</button>
                <span id="copyMsg" class="copy-msg">Copied!</span>
            </div>
        </div>
    </div>
</div>

<script>
async function fetchShebaService() {
    const query = document.getElementById('searchInput').value.trim();
    const status = document.getElementById('status');
    
    if (!query) {
        status.innerText = "অনুগ্রহ করে সার্ভিসের নাম লিখুন!";
        return;
    }

    status.innerText = "খোঁজা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...";

    try {
        // AllOrigins প্রক্সি দিয়ে HTML ডাটা ফেচ করা
        const targetUrl = `https://www.sheba.xyz/search?q=${encodeURIComponent(query)}`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

        const response = await fetch(proxyUrl);
        const data = await response.json();

        if (data && data.contents) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');

            // সার্ভিস কার্ডগুলো খোঁজা
            let title = query;
            let options = [];

            // পেজ থেকে সার্ভিস তথ্য এক্সট্র্যাক্ট করা
            let serviceElements = doc.querySelectorAll('.service-card, .service-item, [class*="service"]');
            
            let resultText = "";
            let found = false;

            // HTML ডাটা পার্সিং লজিক
            doc.querySelectorAll('*').forEach(el => {
                if (el.children.length === 0 && el.innerText) {
                    let txt = el.innerText.trim();
                    if (txt.includes('৳')) {
                        found = true;
                    }
                }
            });

            // যদি ডাইনামিক স্ক্র্যাপিং ফেইল করে, তাহলে ইউজারকে সঠিক সার্চ ফরম্যাট ইনপুটে বসিয়ে সাহায্য করা
            let formattedQuery = query.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            
            document.getElementById('input').value = `${formattedQuery}\n\n৳ `;
            status.innerText = "সার্চ সম্পন্ন! দাম বসিয়ে আউটপুট নিন অথবা নিচে পেস্ট করুন।";
            processData();
        } else {
            status.innerText = "কোনো তথ্য পাওয়া যায়নি।";
        }
    } catch (error) {
        console.error(error);
        status.innerText = "লাইভ কানেকশনে সমস্যা হয়েছে। সরাসরি ডাটা পেস্ট করুন।";
    }
}

function processData() {
    const input = document.getElementById('input').value;
    const discountVal = parseFloat(document.getElementById('discountPercent').value) || 0;

    if (!input.trim()) {
        document.getElementById('output').value = '';
        return;
    }

    const lines = input.split('\n').map(line => line.trim()).filter(line => line.length > 0);
    
    let textLines = [];
    let extractedPrices = [];

    lines.forEach(line => {
        let matches = line.match(/\d+(\.\d+)?/g);
        
        if ((line.includes('৳') || line.includes('per') || line.includes('/')) && matches) {
            matches.forEach(num => {
                let p = parseFloat(num);
                if (!isNaN(p)) extractedPrices.push(p);
            });
        } 
        else if (line.toLowerCase().includes('sft')) {
            textLines.push(line.replace(/(\d+)\s*-\s*(\d+)\s*sft/i, '$1 sft - $2 sft'));
        }
        else if (line.toLowerCase().includes('ltr')) {
            textLines.push(line.replace(/(\d+)\s*ltr\s*-\s*(\d+)\s*ltr/i, '$1 Ltr - $2 Ltr'));
        }
        else if (line.toLowerCase().includes('ton')) {
            textLines.push(line.replace(/(\d+)\s*-\s*(\d+\.?\d*)\s*ton/i, '$1 - $2 Ton'));
        }
        else {
            if (line.toLowerCase() !== 'per' && line !== '/') {
                textLines.push(line);
            }
        }
    });

    let regularPrice = 0;
    let discountedPrice = 0;

    if (extractedPrices.length >= 2) {
        regularPrice = Math.max(...extractedPrices);
        discountedPrice = Math.min(...extractedPrices);
    } 
    else if (extractedPrices.length === 1) {
        regularPrice = extractedPrices[0];
        let discountRate = discountVal / 100;
        discountedPrice = regularPrice - (regularPrice * discountRate);
    }

    let formattedRegularPrice = regularPrice ? regularPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
    let roundedDiscountedPrice = Math.round(discountedPrice);
    let formattedDiscountedPrice = roundedDiscountedPrice ? roundedDiscountedPrice.toLocaleString('en-US') : "0";

    let outputText = textLines.join('\n');
    
    if (regularPrice > 0) {
        if (outputText.length > 0) outputText += '\n\n';
        outputText += `Regular price ${formattedRegularPrice} Tk\n`;
        outputText += `Discounted price ${formattedDiscountedPrice} Tk`;
    }

    document.getElementById('output').value = outputText;
}

function copyOutput() {
    const outputText = document.getElementById('output');
    if (outputText.value) {
        outputText.select();
        document.execCommand('copy');
        
        const copyMsg = document.getElementById('copyMsg');
        copyMsg.style.display = 'inline';
        setTimeout(() => {
            copyMsg.style.display = 'none';
        }, 1000);
    }
}

function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('output').value = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('status').innerText = '';
}
</script>

</body>
</html>
